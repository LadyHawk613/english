<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bar: #163538;
    --page: #2C6266;
    --maroon-500: #7C2C4C;
    --maroon-600: #66233D;
    --maroon-300: #B4557A;
    --cream: #F3DEC0;
    --ink: #EAF3F2;
    --muted: #B8D2CF;
    --line: rgba(255,255,255,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 14px 24px 60px; }

  /* Top bar */

  /* Container that spans the full width and holds the background color */
  .topbar-container {
    background: var(--bar);
    width: 100%;
  }
  .topbar {
    max-width: 1200px;
    margin: 0 auto;
    background: var(--bar);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 28px;
    gap: 20px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mascot {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--maroon-500);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Baloo 2', sans-serif;
    color: var(--cream);
    font-size: 17px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: #fff;
    outline: none;
  }
  .subtitle {
    font-size: 11.5px;
    color: var(--muted);
    outline: none;
    margin-top: 1px;
  }

  .tabs {
    display: flex;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
  }
  .tab {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    color: #fff;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .tab:hover { color: var(--cream); }
  .tab.active { border-bottom-color: #fff; }
  .tab-close {
    margin-left: 7px;
    color: var(--muted);
    font-weight: 400;
    font-size: 12px;
  }
  .tab-close:hover { color: var(--maroon-300); }
  .tab-add {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    background: var(--maroon-500);
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
  }
  .tab-add:hover { background: var(--maroon-600); }

  /* Main content sits directly on the page background */
  .content { padding-top: 18px; }

  .hero {
    display: flex;
    align-items: center;
    gap: 44px;
    margin-bottom: 12px;
  }
  .hero-text { flex: 1 1 380px; }
  .hero-heading {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.15;
    color: var(--cream);
    outline: none;
    max-width: 560px;
  }
  .hero-sub {
    font-size: 15.5px;
    line-height: 1.7;
    color: var(--ink);
    margin-top: 8px;
    max-width: 480px;
    outline: none;
  }
  .hero-image { flex: 0 0 260px; display: flex; justify-content: center; }
  .hero-image img {
    width: 100%;
    max-width: 260px;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.28);
  }

  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 10px;
  }
  .week-nav button {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    background: transparent;
    color: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 16px;
  }
  .week-nav button:hover { background: rgba(255,255,255,0.1); }
  .week-label {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--cream);
    letter-spacing: 0.4px;
    min-width: 210px;
    text-align: center;
  }

  .week-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 16px;
  }
  .day {
    background: #F7F3E8;
    border-radius: 10px;
    border-top: 4px solid var(--maroon-500);
    display: flex;
    flex-direction: column;
    min-height: 280px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0,0,0,0.14);
  }
  .day-head {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--maroon-600);
    padding: 10px 10px 6px;
    text-align: center;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .day-body {
    flex: 1;
    padding: 8px 12px 14px;
    font-size: 13.5px;
    line-height: 1.55;
    outline: none;
    color: #2A2A28;
  }
  .day-body:empty:before {
    content: attr(data-placeholder);
    color: #8A8371;
  }

  /* About me / Syllabus / custom tab content */
  .doc-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 24px;
    color: var(--cream);
    margin: 0 0 14px;
  }
  .doc-body {
    font-size: 15px;
    line-height: 1.8;
    outline: none;
    min-height: 220px;
    color: var(--ink);
    max-width: 720px;
  }
  .doc-body:empty:before {
    content: attr(data-placeholder);
    color: var(--muted);
  }

  .accent-rule {
    height: 3px;
    width: 46px;
    background: var(--maroon-500);
    border-radius: 2px;
    margin: 0 0 18px;
  }

  @media (max-width: 720px) {
    .week-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .topbar { flex-direction: column; align-items: flex-start; }
    .hero { flex-direction: column; }
    .hero-heading { font-size: 30px; }
  }
</style>
</head>
<body>
  
<div class="topbar-container">
  <div class="topbar">
    <div class="brand">
      <div class="mascot">Aa</div>
      <div>
        <div class="title" id="classTitle" contenteditable="true" data-placeholder="Class name">English 101</div>
        <div class="subtitle" id="classSubtitle" contenteditable="true" data-placeholder="Add a subtitle">Universidad Del Azuay</div>
      </div>
      </div>
    <div class="tabs" id="tabsRow"></div>
  </div>
</div>

  <div class="wrap">
    <div class="hero" id="hero">
      <div class="hero-text">
        <div class="hero-heading" id="heroTitle" contenteditable="true" data-placeholder="Welcome message">Welcome to English 101</div>
        <div class="hero-sub" id="heroSubtitle" contenteditable="true" data-placeholder="Add a short welcome note">A friendly, supportive space to build your English skills together, week by week.</div>
      </div>
      <div class="hero-image">
      </div>
    </div>
    <div class="content" id="panel"></div>
  </div>

<script>
const STORAGE_KEY = 'dashboard-state-v1';
const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday'];

let state = {
  classTitle: 'English 101',
  classSubtitle: 'Beginning college English',
  heroTitle: 'Welcome to English 101',
  heroSubtitle: 'A friendly, supportive space to build your English skills together, week by week.',
  activeTab: 'week',
  weekOffset: 0,
  weekDays: ['', '', '', '', ''],
  tabs: [
    { id: 'about', label: 'About me', body: '' },
    { id: 'syllabus', label: 'Syllabus', body: '' }
  ]
};

function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function weekLabel(offset) {
  const monday = mondayOf(new Date());
  monday.setDate(monday.getDate() + offset * 7);
  const friday = new Date(monday);
  friday.setDate(friday.getDate() + 4);
  const opts = { month: 'short', day: 'numeric' };
  return monday.toLocaleDateString('en-US', opts) + ' – ' + friday.toLocaleDateString('en-US', opts);
}

async function save() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  } catch (e) { console.error('save failed', e); }
}

async function load() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      state = Object.assign(state, parsed);
    }
  } catch (e) { /* no saved state yet */ }
  render();
}

function renderTabs() {
  const row = document.getElementById('tabsRow');
  row.innerHTML = '';

  const weekTab = document.createElement('div');
  weekTab.className = 'tab' + (state.activeTab === 'week' ? ' active' : '');
  weekTab.textContent = 'This week';
  weekTab.onclick = () => { state.activeTab = 'week'; render(); save(); };
  row.appendChild(weekTab);

  state.tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = 'tab' + (state.activeTab === tab.id ? ' active' : '');
    el.innerHTML = tab.label.replace(/</g,'&lt;');
    const closer = document.createElement('span');
    closer.className = 'tab-close';
    closer.textContent = '✕';
    closer.title = 'Remove tab';
    closer.onclick = (e) => {
      e.stopPropagation();
      if (confirm('Remove the "' + tab.label + '" tab?')) {
        state.tabs = state.tabs.filter(t => t.id !== tab.id);
        if (state.activeTab === tab.id) state.activeTab = 'week';
        render(); save();
      }
    };
    el.onclick = () => { state.activeTab = tab.id; render(); save(); };
    el.appendChild(closer);
    row.appendChild(el);
  });

  const add = document.createElement('div');
  add.className = 'tab-add';
  add.textContent = '+ Add tab';
  add.title = 'Add a tab';
  add.onclick = () => {
    const label = prompt('Name for the new tab:');
    if (label && label.trim()) {
      const id = 'tab-' + Date.now();
      state.tabs.push({ id, label: label.trim(), body: '' });
      state.activeTab = id;
      render(); save();
    }
  };
  row.appendChild(add);
}

function renderPanel() {
  const panel = document.getElementById('panel');
  const hero = document.getElementById('hero');
  panel.innerHTML = '';
  hero.style.display = state.activeTab === 'week' ? 'flex' : 'none';

  if (state.activeTab === 'week') {
    const nav = document.createElement('div');
    nav.className = 'week-nav';
    const prev = document.createElement('button');
    prev.textContent = '‹';
    prev.onclick = () => { state.weekOffset -= 1; render(); save(); };
    const label = document.createElement('div');
    label.className = 'week-label';
    label.textContent = weekLabel(state.weekOffset);
    const next = document.createElement('button');
    next.textContent = '›';
    next.onclick = () => { state.weekOffset += 1; render(); save(); };
    nav.append(prev, label, next);
    panel.appendChild(nav);

    const grid = document.createElement('div');
    grid.className = 'week-grid';
    DAY_NAMES.forEach((name, i) => {
      const col = document.createElement('div');
      col.className = 'day is-weekday-' + (i+1);
      const head = document.createElement('div');
      head.className = 'day-head';
      head.textContent = name;
      const body = document.createElement('div');
      body.className = 'day-body';
      body.contentEditable = 'true';
      body.setAttribute('data-placeholder', 'Add plans, homework, or notes…');
      body.innerHTML = state.weekDays[i] || '';
      body.oninput = () => { state.weekDays[i] = body.innerHTML; save(); };
      col.append(head, body);
      grid.appendChild(col);
    });
    panel.appendChild(grid);
    return;
  }

  const tab = state.tabs.find(t => t.id === state.activeTab);
  if (!tab) { state.activeTab = 'week'; renderPanel(); return; }

  const title = document.createElement('div');
  title.className = 'doc-title';
  title.textContent = tab.label;
  const rule = document.createElement('div');
  rule.className = 'accent-rule';
  const body = document.createElement('div');
  body.className = 'doc-body';
  body.contentEditable = 'true';
  body.setAttribute('data-placeholder', 'Click to start writing…');
  body.innerHTML = tab.body || '';
  body.oninput = () => { tab.body = body.innerHTML; save(); };

  panel.append(title, rule, body);
}

function render() {
  document.getElementById('classTitle').innerHTML = state.classTitle;
  document.getElementById('classSubtitle').innerHTML = state.classSubtitle;
  document.getElementById('heroTitle').innerHTML = state.heroTitle;
  document.getElementById('heroSubtitle').innerHTML = state.heroSubtitle;
  renderTabs();
  renderPanel();
}

document.getElementById('classTitle').oninput = (e) => { state.classTitle = e.target.innerHTML; save(); };
document.getElementById('classSubtitle').oninput = (e) => { state.classSubtitle = e.target.innerHTML; save(); };
document.getElementById('heroTitle').oninput = (e) => { state.heroTitle = e.target.innerHTML; save(); };
document.getElementById('heroSubtitle').oninput = (e) => { state.heroSubtitle = e.target.innerHTML; save(); };

load();
</script>
</body>
</html>
