<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bar: #163538;
    --page: #2C6266;
    --maroon-500: #7C2C4C;
    --maroon-600: #66233D;
    --maroon-300: #B4557A;
    --cream: #F3DEC0;
    --ink: #EAF3F2;
    --muted: #B8D2CF;
    --line: rgba(255,255,255,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 14px 24px 60px; }

  /* Top bar */
  .topbar {
    background: var(--bar);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 28px;
    gap: 20px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mascot {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--maroon-500);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Baloo 2', sans-serif;
    color: var(--cream);
    font-size: 17px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: #fff;
    outline: none;
  }
  .subtitle {
    font-size: 11.5px;
    color: var(--muted);
    outline: none;
    margin-top: 1px;
  }

  .tabs {
    display: flex;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
  }
  .tab {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    color: #fff;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .tab:hover { color: var(--cream); }
  .tab.active { border-bottom-color: #fff; }
  .tab-close {
    margin-left: 7px;
    color: var(--muted);
    font-weight: 400;
    font-size: 12px;
  }
  .tab-close:hover { color: var(--maroon-300); }
  .tab-add {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    background: var(--maroon-500);
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
  }
  .tab-add:hover { background: var(--maroon-600); }

  /* Main content sits directly on the page background */
  .content { padding-top: 18px; }

  .hero {
    display: flex;
    align-items: center;
    gap: 44px;
    margin-bottom: 24px;
  }
  .hero-text { flex: 1; }
  .hero-heading {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.15;
    color: var(--cream);
    outline: none;
    max-width: 560px;
  }
  .hero-sub {
    font-size: 15.5px;
    line-height: 1.7;
    color: var(--ink);
    margin-top: 8px;
    max-width: 480px;
    outline: none;
  }
  
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 16px;
  }
  .week-nav button {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    background: transparent;
    color: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 16px;
  }
  .week-nav button:hover { background: rgba(255,255,255,0.1); }
  .week-label {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--cream);
    letter-spacing: 0.4px;
    min-width: 210px;
    text-align: center;
    outline: none;
  }

  .week-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 16px;
  }
  .day {
    background: #F7F3E8;
    border-radius: 10px;
    border-top: 4px solid var(--maroon-500);
    display: flex;
    flex-direction: column;
    min-height: 280px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0,0,0,0.14);
  }
  .day-head {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--maroon-600);
    padding: 10px 10px 6px;
    text-align: center;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    outline: none;
  }
  .day-body {
    flex: 1;
    padding: 8px 12px 14px;
    font-size: 13.5px;
    line-height: 1.55;
    outline: none;
    color: #2A2A28;
  }
  .day-body:empty:before {
    content: attr(data-placeholder);
    color: #8A8371;
  }

  /* About me / Syllabus / custom tab content */
  .doc-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 24px;
    color: var(--cream);
    margin: 0 0 14px;
  }
  .doc-body {
    font-size: 15px;
    line-height: 1.8;
    outline: none;
    min-height: 220px;
    color: var(--ink);
    max-width: 720px;
  }
  .doc-body:empty:before {
    content: attr(data-placeholder);
    color: var(--muted);
  }

  .accent-rule {
    height: 3px;
    width: 46px;
    background: var(--maroon-500);
    border-radius: 2px;
    margin: 0 0 18px;
  }

  @media (max-width: 720px) {
    .week-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .topbar { flex-direction: column; align-items: flex-start; }
    .hero { flex-direction: column; }
    .hero-heading { font-size: 30px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div class="mascot">Aa</div>
      <div>
        <div class="title" id="classTitle" contenteditable="true" data-placeholder="Class name">English 101</div>
        <div class="subtitle" id="classSubtitle" contenteditable="true" data-placeholder="Add a subtitle">Beginning college English</div>
      </div>
    </div>
    <div class="tabs" id="tabsRow"></div>
  </div>

  <div class="wrap">
    <div class="hero" id="hero">
      <div class="hero-text">
        <div class="hero-heading" id="heroTitle" contenteditable="true" data-placeholder="Welcome message">Welcome to English 101</div>
        <div class="hero-sub" id="heroSubtitle" contenteditable="true" data-placeholder="Add a short welcome note">A friendly, supportive space to build your English skills together, week by week.</div>
      </div>
    </div>

    <!-- Calendar / Week View Section -->
    <div class="week-nav">
      <button id="prevWeek">&#10094;</button>
      <div class="week-label" id="weekLabel" contenteditable="true">Week 1: Getting Started</div>
      <button id="nextWeek">&#10095;</button>
    </div>

    <div class="week-grid" id="weekGrid">
      <div class="day">
        <div class="day-head" contenteditable="true">Monday</div>
        <div class="day-body" contenteditable="true" data-placeholder="Add notes for Monday..."></div>
      </div>
      <div class="day">
        <div class="day-head" contenteditable="true">Tuesday</div>
        <div class="day-body" contenteditable="true" data-placeholder="Add notes for Tuesday..."></div>
      </div>
      <div class="day">
        <div class="day-head" contenteditable="true">Wednesday</div>
        <div class="day-body" contenteditable="true" data-placeholder="Add assignments or notes..."></div>
      </div>
      <div class="day">
        <div class="day-head" contenteditable="true">Thursday</div>
        <div class="day-body" contenteditable="true" data-placeholder="Add notes for Thursday..."></div>
      </div>
      <div class="day">
        <div class="day-head" contenteditable="true">Friday</div>
        <div class="day-body" contenteditable="true" data-placeholder="Add wrap-up notes..."></div>
      </div>
    </div>
  </div>

</body>
</html>
